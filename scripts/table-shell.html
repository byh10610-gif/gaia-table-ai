<header class="appHeader">
 <div class="brand"><svg class="brandMark" viewBox="0 0 40 44" aria-hidden="true"><path d="M20 2 37 12v20L20 42 3 32V12Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="m20 9 11 6.5v13L20 35 9 28.5v-13Z" fill="none" stroke="currentColor" stroke-width=".65"/><circle cx="20" cy="22" r="5.5" fill="currentColor"/><path d="M3 12 15 19m10 6 12 7" stroke="currentColor" stroke-width=".65"/></svg><div class="brandName"><h1>가이아 프로젝트</h1><small>잃어버린 함대</small></div></div>
 <div class="toolbar"><button id="new" class="gameOnly">새 게임</button><button id="undo" class="gameOnly">되돌리기</button><div class="saveActions" role="group" aria-label="게임 파일"><button id="backup" title="게임 파일 저장"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>저장</button><button id="restore" title="게임 파일 불러오기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5"/></svg>불러오기</button></div><span id="saveStatus">저장됨</span><input type="file" id="import" accept=".json,application/json" hidden></div>
</header>
<main>
 <div id="error" hidden role="alert"></div>
 <section id="setup" class="lobby">
  <div class="lobbyIdentity"><div><h2>새 게임</h2><div class="lobbyRule"></div></div><div class="lobbyArt" aria-hidden="true"><img src="./assets/lobby/sector-01.png" alt=""><img src="./assets/lobby/sector-02.png" alt=""><img src="./assets/lobby/sector-04.png" alt=""></div></div>
  <div class="lobbyForm setupBox">
   <div class="setupSectionHead"><span>01</span><h3>게임 설정</h3></div>
   <div class="gameOptions"><label>플레이어 수<select id="count"><option>2</option><option selected>3</option><option>4</option></select></label><label>인공지능 난이도<select id="difficulty"><option>쉬움</option><option selected>보통</option><option>어려움</option></select></label></div>
   <div class="setupSectionHead"><span>02</span><h3>플레이어</h3></div><div id="players"></div>
   <details class="lobbyAdvanced"><summary>세부 설정</summary><label>경제 타일<select id="economy"><option value="random" selected>자동 추첨</option><option value="victory_points">승점 면</option><option value="power_charge">파워 충전 면</option></select></label></details>
   <button id="start" class="primary">자동 추첨</button>
  </div>
 </section>
 <section id="app" hidden>
  <div class="status"><strong id="round"></strong><span id="turn"></span></div>
  <nav id="tabs" aria-label="게임 화면"><button data-view="overview">배치표</button><button data-view="play">플레이</button><button data-view="map">지도</button><button data-view="settings">타일 설정</button><button data-view="correction">상태 보정</button><button data-view="log">기록</button></nav>
  <div id="cards" class="cards"></div>
  <div class="layout"><div class="mapWrap"><div class="mapTopline"><b>은하 지도</b><span><i class="recentDot"></i>최근 배치</span></div><div id="map"></div></div><div id="panel" class="panel"></div></div>
 </section>
</main>
<dialog id="confirm"><h2 id="confirmText"></h2><p id="confirmDetail"></p><div id="confirmMap"></div><button id="confirmButton" class="primary">실행 완료</button><button id="confirmCancel">취소</button></dialog>
